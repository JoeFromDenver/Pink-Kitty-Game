<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pink Kitty Maze</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.min.js"></script>

    <link rel="manifest" href="manifest.json">

    <meta name="theme-color" content="#fdd5ea">

    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-96x96.png"> <link rel="icon" type="image/png" sizes="16x16" href="icons/icon-72x72.png"> <link rel="apple-touch-icon" href="icons/icon-152x152.png"> <style>
        /* General Styles & Vaporwave Theme */
        body {
            font-family: 'Press Start 2P', cursive;
            background: linear-gradient(135deg, #fdd5ea, #b0d2f2); /* Lighter Pink to Baby Blue */
            color: #f8f0fc;
            margin: 0;
            padding: 5px; /* Reduced body padding */
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden; /* Prevent scrollbars */
            text-shadow: 1px 1px #6b5f80; /* Softer shadow */
            /* Prevent pull-to-refresh and other touch actions on the body */
            touch-action: none;
            -webkit-user-select: none; /* Safari */
            -ms-user-select: none; /* IE 10+ */
            user-select: none; /* Standard syntax */
        }

        .hidden {
            display: none !important;
        }

        .container {
            background-color: rgba(80, 70, 110, 0.85); /* Slightly lighter, still purpleish */
            border: 3px solid #f7b2e1; /* Softer, brighter pink border */
            box-shadow: 0 0 10px #f7b2e1, 0 0 20px #f7b2e1 inset;
            padding: 15px; /* Reduced container padding */
            border-radius: 12px; /* More rounded */
            text-align: center;
            width: 90%;
            max-width: 550px; /* Slightly smaller max-width for start/end */
            margin-bottom: 10px; /* Reduced margin */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #game-screen-container {
            width: 98vw; /* More screen width */
            height: 98vh; /* More screen height */
            max-width: 1200px;
            max-height: 900px;
            padding: 10px; /* Reduced padding for game screen */
            justify-content: space-around; /* Better space distribution */
            /* Prevent default touch actions on the container */
            touch-action: none;
        }

        h1 {
            color: #ffffff;
            font-size: 1.7em; /* Slightly smaller */
            margin-bottom: 10px;
            text-shadow: 2px 2px #8ba5c0;
        }
         h2 {
            color: #ffffff;
            margin-bottom: 8px;
        }

        p {
            font-size: 0.8em; /* Slightly smaller */
            line-height: 1.4;
            margin-bottom: 10px;
        }

        button {
            font-family: 'Press Start 2P', cursive;
            background-color: #e6dff0; /* Very light lavender */
            color: #594c73;
            border: 2px solid;
            border-color: #f5f0fa #c0b8d0 #c0b8d0 #f5f0fa;
            padding: 8px 12px; /* Smaller padding */
            margin: 6px 4px;    /* Smaller margin */
            cursor: pointer;
            font-size: 0.75em;
            text-shadow: none;
            box-shadow: 1px 1px 0px #8c82a3;
            border-radius: 4px;
            transition: all 0.1s ease;
        }

        button:active {
            border-color: #c0b8d0 #f5f0fa #f5f0fa #c0b8d0;
            box-shadow: inset 1px 1px 0px #8c82a3;
            transform: translate(1px, 1px);
        }

        button:hover {
            background-color: #f0eaf5;
            box-shadow: 1px 1px 3px #f7b2e1;
        }

        #game-info {
            display: flex;
            justify-content: space-around;
            width: 100%;
            margin-bottom: 8px; /* Reduced margin */
            font-size: 0.7em;
            flex-shrink: 0;
        }

        #maze-canvas {
            border: 2px solid #ccebff; /* Lighter blue border */
            /* Floor color set in JS */
            box-shadow: 0 0 6px #ccebff; /* Softer glow for canvas border */
            display: block;
            background-color: #d6eaff; /* Set explicit background for canvas element */
            /* touch-action: none; /* Moved to container */
        }

        #mobile-controls {
            margin-top: 10px; /* Reduced margin */
            display: grid;
            grid-template-columns: repeat(3, 45px); /* Standardized size */
            grid-template-rows: repeat(2, 45px);
            gap: 6px; /* Reduced gap */
            width: auto;
            max-width: 147px; /* Calculated: (45px * 3 + 6px * 2) */
            flex-shrink: 0;
            justify-content: center;
        }

        #mobile-controls button {
            font-size: 1.1em;
            padding: 0;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f7b2e1;
            color: #594c73;
            border-color: #fdeaf5 #e09dc8 #e09dc8 #fdeaf5;
            text-shadow: none;
            border-radius: 5px;
        }
        #mobile-controls button:active {
             border-color: #e09dc8 #fdeaf5 #fdeaf5 #e09dc8;
        }
        /* SVG Arrows for consistency */
        .arrow-svg { width: 60%; height: 60%; fill: #594c73; }


        .up-arrow { grid-column: 2 / 3; grid-row: 1 / 2; }
        .left-arrow { grid-column: 1 / 2; grid-row: 2 / 3; }
        .down-arrow { grid-column: 2 / 3; grid-row: 2 / 3; }
        .right-arrow { grid-column: 3 / 4; grid-row: 2 / 3; }

        /* Container for end screen pets */
        .pet-container {
            display: flex;
            justify-content: center; /* Center items horizontally */
            align-items: center; /* Align items vertically */
            gap: 20px; /* Add space between pets */
            width: 100%; /* Take full width of parent */
            margin: 8px auto; /* Keep original margin */
        }

        .kitten-face, .puppy-face { /* Apply size to both */
            width: 75px;
            height: 75px;
            /* Remove individual margins */
        }
        /* House SVG Styles (End Screen) */
        .house-icon-svg {
            width: 65px;
            height: 65px;
            margin: 6px auto;
        }
        .house-icon-svg .house-body { fill: #FFFFFF; } /* White body */
        .house-icon-svg .house-roof { fill: #2F4F4F; } /* Dark Slate Blue roof */
        .house-icon-svg .house-door { fill: #2F4F4F; } /* Dark Slate Blue door */
        .house-icon-svg .house-window { fill: #ADD8E6; stroke: #2F4F4F; stroke-width: 1.5; } /* Light blue window, dark border */


        @media (max-width: 600px) {
            body { padding: 3px; }
            .container { padding: 12px; width: 96%; }
            #game-screen-container { padding: 8px; width: 100%; }
            h1 { font-size: 1.4em; }
            p { font-size: 0.75em; }
            button { font-size: 0.7em; padding: 7px 10px; }
            #game-info { font-size: 0.65em; }

            #mobile-controls {
                grid-template-columns: repeat(3, 42px);
                grid-template-rows: repeat(2, 42px);
                gap: 5px;
             }
            #mobile-controls button { width: 42px; height: 42px; font-size: 1em; }
            .kitten-face, .puppy-face { width: 65px; height: 65px; } /* Adjust size */
            .pet-container { gap: 15px; }
        }
         @media (max-width: 400px) {
            h1 { font-size: 1.2em; }
            .kitten-face, .puppy-face { width: 55px; height: 55px; } /* Adjust size */
            .house-icon-svg { width: 45px; height: 45px; }
            #mobile-controls {
                grid-template-columns: repeat(3, 38px);
                grid-template-rows: repeat(2, 38px);
                gap: 4px;
            }
            #mobile-controls button { width: 38px; height: 38px; font-size: 0.9em;}
            .pet-container { gap: 10px; }
        }
    </style>
</head>

    <script>
        // --- Game Constants & State ---
        const GameState = { START_SCREEN: 'start_screen', PLAYING: 'playing', END_SCREEN: 'end_screen' };
        let currentGameState = GameState.START_SCREEN;
        const MAZE_FLOOR_COLOR = '#d6eaff';
        const MAZE_WALL_COLOR = '#adc9e0';
        const MAZE_WALL_GLOW = '#e0f7fa';

        // House Colors (Consistent)
        const HOUSE_BODY_COLOR = '#FFFFFF';
        const HOUSE_ROOF_COLOR = '#2F4F4F';
        const HOUSE_DOOR_COLOR = '#2F4F4F';
        const HOUSE_WINDOW_COLOR = '#ADD8E6';
        const HOUSE_WINDOW_STROKE_COLOR = '#2F4F4F';

        // Kitty Colors for Canvas
        const KITTY_HEAD_COLOR = '#FFE4F1'; // Very light pink for head
        const KITTY_BODY_COLOR = KITTY_HEAD_COLOR; // Use same pink for body
        const KITTY_EAR_COLOR = KITTY_HEAD_COLOR;  // Use same pink for outer ears
        const KITTY_NOSE_COLOR = '#f7b2e1'; // Pink for nose
        const KITTY_OUTLINE_COLOR = '#6b5f80'; // Dark grey outline
        const KITTY_OUTLINE_OFFSET = 1; // Pixel offset for the background outline shape (head/body/house)
        const KITTY_OUTLINE_THICKNESS = 2; // Adjusted thickness for ear/roof stroke
        const KITTY_EYE_WHITE_COLOR = '#FFFFFF';
        const KITTY_EYE_PUPIL_COLOR = '#4a3f60'; // Dark pupil

        // Celebration Animation Constants
        const CELEBRATION_DURATION = 2.0; // Seconds
        const CELEBRATION_HOP_AMPLITUDE = 0.2; // Fraction of kitty size
        const CELEBRATION_HOP_FREQUENCY = Math.PI * 4; // Speed of hops

        // Hop Animation Constants
        const HOP_DURATION = 0.3; // Seconds (quicker hop)
        const HOP_AMPLITUDE = 0.15; // Fraction of kitty size (smaller hop)
        const HOP_FREQUENCY = Math.PI * (2 / HOP_DURATION); // Ensure one full hop cycle

        // Touch Control Constants
        const MIN_SWIPE_DISTANCE = 30; // Minimum pixels to register as a swipe

        const Difficulty = {
            EASY: { name: 'Easy', size: 10, bonus: 10, treats: 5 },
            MEDIUM: { name: 'Medium', size: 15, bonus: 20, treats: 10 },
            HARD: { name: 'Hard', size: 20, bonus: 30, treats: 15 }
        };
        let currentDifficulty = Difficulty.EASY;

        let maze = [];
        let player = { x: 0, y: 0, visualX: 0, visualY: 0, isMoving: false, targetX: 0, targetY: 0, moveProgress: 0 };
        let home = { x: 0, y: 0 };
        let treats = [];
        let currentMazeScore = 0;
        let cumulativeSessionScore = 0;
        let lastFrameTime = 0;
        // Animation States
        let isCelebrating = false;
        let celebrationStartTime = 0;
        let isHopping = false;
        let hopStartTime = 0;
        // Touch State
        let touchStartX = null;
        let touchStartY = null;


        // --- DOM Elements ---
        const startScreenDiv = document.getElementById('start-screen');
        const gameScreenContainer = document.getElementById('game-screen-container');
        const endScreenDiv = document.getElementById('end-screen');
        const mazeCanvas = document.getElementById('maze-canvas');
        const ctx = mazeCanvas.getContext('2d');
        const scoreDisplay = document.getElementById('current-score');
        const difficultyDisplay = document.getElementById('current-difficulty');
        const finalMazeScoreDisplay = document.getElementById('final-maze-score');
        const cumulativeScoreDisplay = document.getElementById('cumulative-session-score');
        const endMessageDisplay = document.getElementById('end-message');
        const mobileControlsDiv = document.getElementById('mobile-controls');
        const playAgainText = document.getElementById('play-again-text');


        // --- Sound Synthesis (Tone.js) ---
        let mainSynth, kickSynth, treatMelodySynth;
        async function initAudio() {
            // ... (Audio initialization code remains the same) ...
             if (!Tone.context.state || Tone.context.state !== 'running') { await Tone.start(); console.log("Audio Context Started."); } if (!mainSynth) { mainSynth = new Tone.FMSynth({ harmonicity: 1.5, modulationIndex: 6, envelope: { attack: 0.005, decay: 0.1, sustain: 0.005, release: 0.08 }, modulationEnvelope: { attack: 0.005, decay: 0.1, sustain: 0.005, release: 0.08 } }).toDestination(); } if (!kickSynth) { kickSynth = new Tone.MembraneSynth({ pitchDecay: 0.015, octaves: 4, envelope: { attack: 0.001, decay: 0.25, sustain: 0.005, release: 0.15 } }).toDestination(); } if (!treatMelodySynth) { treatMelodySynth = new Tone.Synth({ oscillator: { type: 'triangle' }, envelope: { attack: 0.005, decay: 0.1, sustain: 0.02, release: 0.15 } }).toDestination(); }
        }

        const sounds = {
            // ... (Sound playback functions remain the same) ...
             gameStart: () => { if (kickSynth && Tone.context.state === 'running') kickSynth.triggerAttackRelease("D2", "8n", Tone.now()); if (mainSynth && Tone.context.state === 'running') mainSynth.triggerAttackRelease("A4", "8n", Tone.now() + 0.08); }, treatCollect: () => { if (treatMelodySynth && Tone.context.state === 'running') { const now = Tone.now(); treatMelodySynth.triggerAttackRelease("C6", "16n", now); treatMelodySynth.triggerAttackRelease("E6", "16n", now + 0.1); } }, reachHome: () => { if (mainSynth && Tone.context.state === 'running') { const now = Tone.now(); mainSynth.triggerAttackRelease("D5", "16n", now); mainSynth.triggerAttackRelease("F#5", "16n", now + 0.1); mainSynth.triggerAttackRelease("A5", "8n", now + 0.2); mainSynth.triggerAttackRelease("D6", "4n", now + 0.35); } }, buttonClick: () => { if (mainSynth && Tone.context.state === 'running') mainSynth.triggerAttackRelease("E4", "32n", Tone.now()); }, hop: () => { if (mainSynth && Tone.context.state === 'running') mainSynth.triggerAttackRelease("C5", "16n", Tone.now()); }
        };

        // --- Maze Generation ---
        function generateMaze(size) {
            // ... (Maze generation logic remains the same) ...
             maze = Array(size).fill(null).map(() => Array(size).fill(null).map(() => ({ n: true, s: true, e: true, w: true, visited: false }))); let stack = []; player.x = 0; player.y = 0; player.visualX = player.x; player.visualY = player.y; home.x = size - 1; home.y = size - 1; let currentCell = { x: player.x, y: player.y }; maze[currentCell.y][currentCell.x].visited = true; stack.push(currentCell); while (stack.length > 0) { currentCell = stack.pop(); let neighbors = []; if (currentCell.y > 0 && !maze[currentCell.y - 1][currentCell.x].visited) neighbors.push({ x: currentCell.x, y: currentCell.y - 1, wall: 'n', opposite: 's' }); if (currentCell.y < size - 1 && !maze[currentCell.y + 1][currentCell.x].visited) neighbors.push({ x: currentCell.x, y: currentCell.y + 1, wall: 's', opposite: 'n' }); if (currentCell.x < size - 1 && !maze[currentCell.y][currentCell.x + 1].visited) neighbors.push({ x: currentCell.x + 1, y: currentCell.y, wall: 'e', opposite: 'w' }); if (currentCell.x > 0 && !maze[currentCell.y][currentCell.x - 1].visited) neighbors.push({ x: currentCell.x - 1, y: currentCell.y, wall: 'w', opposite: 'e' }); if (neighbors.length > 0) { stack.push(currentCell); let nextCell = neighbors[Math.floor(Math.random() * neighbors.length)]; maze[currentCell.y][currentCell.x][nextCell.wall] = false; maze[nextCell.y][nextCell.x][nextCell.opposite] = false; maze[nextCell.y][nextCell.x].visited = true; stack.push(nextCell); } } if (size === 1) { home.x = player.x; home.y = player.y; }
        }

        gameScreenContainer.addEventListener('touchstart', handleTouchStart, { passive: false });
        gameScreenContainer.addEventListener('touchmove', handleTouchMove, { passive: false });
        gameScreenContainer.addEventListener('touchend', handleTouchEnd, { passive: false });


        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('orientationchange', () => { setTimeout(resizeCanvas, 100); });

        // --- Initial Setup ---
        loadSessionScore();
        switchScreen(GameState.START_SCREEN);
        // Update the end screen text initially if needed (though it's hidden)
        if (playAgainText) {
             playAgainText.textContent = "Rescue Pink Kitty again?";
        }
        setTimeout(resizeCanvas, 0);

        // --- PWA Service Worker Registration ---
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', () => {
            // UPDATED: Use relative path for service worker
            navigator.serviceWorker.register('service-worker.js')
              .then(registration => {
                console.log('ServiceWorker registration successful with scope: ', registration.scope);
              })
              .catch(error => {
                console.log('ServiceWorker registration failed: ', error);
              });
          });
        }

    </script>
</body>
</html>
